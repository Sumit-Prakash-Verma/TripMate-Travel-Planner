
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TripMate Login Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 450px;
            margin: 50px auto;
            padding: 20px;
        }

        input, button {
            display: block;
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            margin: 12px 0;
        }

        button {
            cursor: pointer;
        }

        #result {
            overflow-wrap: anywhere;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
    <h2>TripMate Login Test</h2>

    <form id="login-form">
        <input
            id="email"
            type="email"
            placeholder="Email address"
            required
        >

        <input
            id="password"
            type="password"
            placeholder="Password"
            required
        >

        <button type="submit">Login</button>
    </form>

    <button id="me-button" type="button">Check Current User</button>
    <button id="logout-button" type="button">Logout</button>

    <p id="result" role="status"></p>

    <script>
        const result = document.getElementById("result");

        async function apiRequest(url, options = {}) {
            const response = await fetch(url, {
                credentials: "same-origin",
                ...options,
                headers: {
                    "Content-Type": "application/json",
                    ...(options.headers || {})
                }
            });

            const text = await response.text();
            let data;

            try {
                data = text ? JSON.parse(text) : {};
            } catch {
                data = { message: text || "Unexpected response" };
            }

            return { response, data };
        }

        document.getElementById("login-form")
            .addEventListener("submit", async event => {
                event.preventDefault();
                result.textContent = "Logging in...";

                try {
                    const { response, data } = await apiRequest(
                        "/api/auth/login",
                        {
                            method: "POST",
                            body: JSON.stringify({
                                email: document.getElementById("email").value,
                                password: document.getElementById("password").value
                            })
                        }
                    );

                    result.textContent =
                        "Login status: " + response.status + "\n" +
                        JSON.stringify(data, null, 2);
                } catch (error) {
                    result.textContent = "Request failed: " + error.message;
                }
            });

        document.getElementById("me-button")
            .addEventListener("click", async () => {
                try {
                    const { response, data } =
                        await apiRequest("/api/auth/me");

                    result.textContent =
                        "Current user status: " + response.status + "\n" +
                        JSON.stringify(data, null, 2);
                } catch (error) {
                    result.textContent = "Request failed: " + error.message;
                }
            });

        document.getElementById("logout-button")
            .addEventListener("click", async () => {
                try {
                    const { response, data } = await apiRequest(
                        "/api/auth/logout",
                        { method: "POST" }
                    );

                    result.textContent =
                        "Logout status: " + response.status + "\n" +
                        JSON.stringify(data, null, 2);
                } catch (error) {
                    result.textContent = "Request failed: " + error.message;
                }
            });
    </script>
</body>
</html>
